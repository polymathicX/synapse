<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synapse</title></head>
<body><main class="popup">
  <a class="brand" href="#" id="brand"><span class="mark" aria-hidden="true">✳</span> Synapse <span class="badge">LOCAL FIRST</span></a>
  <p class="eyebrow">Keep your train of thought</p><h1>Your context. Anywhere.</h1>
  <p class="muted">Capture this conversation and pick up where you left off, with any AI.</p>
  <div class="actions"><button id="capture" class="button primary">Capture this conversation</button><button id="workspace" class="button subtle">Workspace</button></div>
  <button id="floating" class="button subtle">Enable floating Synapse on this service</button>
  <div id="status" role="status" aria-live="polite" class="status"></div>
  <section class="recent"><h2>Recent contexts</h2><div id="recent"></div></section>
  <p class="footer-note">Saved on this device. Nothing is sent until you choose to transfer it.</p>
</main><script type="module" src="./main.ts"></script></body></html>
